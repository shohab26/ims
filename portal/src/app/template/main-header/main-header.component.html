<nav class="main-header navbar navbar-expand navbar-white navbar-light app-navbar">
  <!-- Sidebar toggle -->
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link sidebar-toggle" data-widget="pushmenu" href="#" role="button">
        <i class="fas fa-bars"></i>
      </a>
    </li>
  </ul>

  <!-- Page breadcrumb / title area (optional, left side) -->
  <div class="navbar-brand-area d-none d-sm-flex align-items-center ml-2">
    <span class="nav-page-label">Inventory Management System</span>
  </div>

  <!-- Right side -->
  <ul class="navbar-nav ml-auto align-items-center">

    <!-- User menu -->
    <li class="nav-item dropdown user-dropdown" *ngIf="user">
      <a href="#" class="nav-link user-toggle dropdown-toggle" data-toggle="dropdown">
        <div class="user-avatar">
          {{ user.full_name.charAt(0).toUpperCase() }}
        </div>
        <div class="user-meta d-none d-md-block">
          <span class="user-meta-name">{{ user.full_name }}</span>
          <span class="user-meta-role">{{ formatRoleName(user.role_name) }}</span>
        </div>
        <i class="fas fa-chevron-down ml-2 d-none d-md-inline chevron-icon"></i>
      </a>
      <div class="dropdown-menu dropdown-menu-right user-dropdown-menu">
        <div class="dropdown-user-header">
          <div class="duh-avatar">{{ user.full_name.charAt(0).toUpperCase() }}</div>
          <div>
            <div class="duh-name">{{ user.full_name }}</div>
            <div class="duh-email">{{ user.email }}</div>
            <span class="duh-badge" [class.duh-badge-admin]="user.role_name === 'super_admin'">
              {{ formatRoleName(user.role_name) }}
            </span>
          </div>
        </div>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item dd-logout" (click)="logout()">
          <i class="fas fa-sign-out-alt"></i> Sign Out
        </a>
      </div>
    </li>

  </ul>
</nav>
