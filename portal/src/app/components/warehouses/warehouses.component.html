<div class="page-section">

    <div class="page-section-header">
        <h4 class="card-title mb-0">{{title}}</h4>
        <button type="button" class="btn btn-primary" (click)="menuType=true" data-toggle="modal"
            data-target="#exampleModal" *ngIf="authService.hasPermission('warehouse', 'create')">
            <i class="fas fa-plus mr-1"></i> Create New
        </button>
    </div>

    <div class="mt-3">
        <input type="text" class="form-control mb-3" placeholder="Search warehouses..." (keyup)="onSearch($any($event.target).value)">
        <table class="table table-striped text-center">
            <thead>
                <tr>
                    <th scope="col">SI</th>
                    <th scope="col">Id</th>
                    <th scope="col">Warehouse</th>
                    <th scope="col">Action</th>

                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let row of warehouse; index as i">
                    <td>{{i+1}}</td>
                    <td>{{row.id}}</td>
                    <td>{{row.wname}}</td>
                    <td>

                        <div class="btn-group">
                            <a class="btn" (click)="viewWarehouse(row)" data-toggle="modal" data-target="#exampleModal">
                                <fa-icon [icon]="faeye" style="color: #17a2b8;"></fa-icon></a>
                            <a class="btn" (click)="onEditById(row)" data-toggle="modal" data-target="#exampleModal" *ngIf="authService.hasPermission('warehouse', 'update')">
                                <fa-icon [icon]="editicon" style="color: #5c34d5;"></fa-icon></a>


                            <a class="btn" (click)="deleteWarehouse(row.id)" *ngIf="authService.hasPermission('warehouse', 'delete')">
                                <fa-icon [icon]="fatrash" style="color: #d53449;"></fa-icon></a>
                        </div>
                    </td>

                </tr>

            </tbody>
        </table>
        <nav *ngIf="totalPages > 1">
            <ul class="pagination pagination-sm justify-content-end mb-0">
                <li class="page-item" [class.disabled]="page === 1"><a class="page-link" (click)="goToPage(page-1)">«</a></li>
                <li class="page-item" *ngFor="let p of [].constructor(totalPages); let i = index" [class.active]="page === i+1"><a class="page-link" (click)="goToPage(i+1)">{{i+1}}</a></li>
                <li class="page-item" [class.disabled]="page === totalPages"><a class="page-link" (click)="goToPage(page+1)">»</a></li>
            </ul>
        </nav>
    </div>

    <!-- Modal -->


    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">{{title2}}</h5>
                    <button type="button" class="close" #closeModal data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">

                    <form [formGroup]="wareForm">
                        <div class="mb-3">
                            <label class="form-label">Warehouse Name</label>
                            <input type="text" class="form-control" formControlName="wname">
                        </div>
                        
                    </form>

                </div>
                <div class="modal-footer">
                    <div class="btn-group">
                        <div class="px-2">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        </div>
                        <div *ngIf=" menuType == true">
                            <button type="submit" class="btn btn-success" [disabled]="wareForm.invalid"
                                (click)="onSubmit()">Submit</button>
                        </div>
                        <div *ngIf="menuType == false && !viewOnly">
                            <button type="submit" class="btn btn-warning" [disabled]="wareForm.invalid"
                                (click)="editWarehouse()">Update</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
