<section class="content pt-3">
  <div class="container-fluid">
    <div class="card chat-card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="card-title mb-0">
          <i class="fas fa-robot mr-2"></i> AI Assistant
        </h3>
        <div>
          <button *ngIf="loading" class="btn btn-sm btn-outline-danger mr-2" (click)="stop()">
            <i class="fas fa-stop mr-1"></i> Stop
          </button>
          <button class="btn btn-sm btn-outline-secondary" (click)="clearChat()" [disabled]="messages.length === 0 && !loading">
            <i class="fas fa-broom mr-1"></i> New chat
          </button>
        </div>
      </div>

      <div class="card-body chat-scroll" #scrollArea>
        <!-- Empty state with suggestions -->
        <div *ngIf="messages.length === 0" class="empty-state">
          <div class="empty-icon"><i class="fas fa-robot"></i></div>
          <h5>Ask anything about your inventory</h5>
          <p class="text-muted">Stock levels, sales trends, restocking advice, problem analysis — the assistant reads your live data.</p>
          <div class="suggestion-list">
            <button *ngFor="let s of suggestions" class="suggestion-chip" (click)="useSuggestion(s)">{{ s }}</button>
          </div>
        </div>

        <!-- Conversation -->
        <div *ngFor="let m of messages" class="chat-row" [class.user-row]="m.role === 'user'">
          <div class="avatar" [class.user-avatar]="m.role === 'user'">
            <i class="fas" [ngClass]="m.role === 'user' ? 'fa-user' : 'fa-robot'"></i>
          </div>
          <div class="bubble" [class.user-bubble]="m.role === 'user'">{{ m.content }}</div>
        </div>

        <!-- Live answer / status while the model works -->
        <div *ngIf="loading" class="chat-row">
          <div class="avatar"><i class="fas fa-robot"></i></div>
          <div class="bubble">
            <span *ngIf="streaming">{{ streaming }}<span class="caret"></span></span>
            <span *ngIf="!streaming" class="status-line">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
              <em class="ml-2">{{ status }}</em>
            </span>
          </div>
        </div>

        <div *ngIf="error" class="alert alert-danger py-2 mt-2 mb-0">{{ error }}</div>
      </div>

      <div class="card-footer">
        <div class="input-row">
          <textarea
            class="form-control chat-input"
            rows="1"
            placeholder="Ask about stock, sales, forecasts…"
            [(ngModel)]="draft"
            (keydown)="onKeydown($event)"
            [disabled]="loading"></textarea>
          <button class="btn btn-primary send-btn" (click)="send()" [disabled]="loading || !draft.trim()">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
        <small class="text-muted">Enter to send · Shift+Enter for a new line</small>
      </div>
    </div>
  </div>
</section>
